<svg xmlns="http://www.w3.org/2000/svg" width="800" height="170" viewBox="0 0 800 170">
<style>text{font-family:Courier New,monospace;font-size:13px}
.pl{stroke-dasharray:600;animation:pl 8.0s linear infinite}@keyframes pl{0%,5%{stroke-dashoffset:600}65%,95%{stroke-dashoffset:0}100%{stroke-dashoffset:600}}
.n0{animation:on0 8.0s steps(1) infinite}@keyframes on0{0%,6.2%{fill:#141414}6.8%,95%{fill:#e5e5e5}100%{fill:#141414}}.n1{animation:on1 8.0s steps(1) infinite}@keyframes on1{0%,26.2%{fill:#141414}26.8%,95%{fill:#e5e5e5}100%{fill:#141414}}.n2{animation:on2 8.0s steps(1) infinite}@keyframes on2{0%,46.2%{fill:#141414}46.8%,95%{fill:#e5e5e5}100%{fill:#141414}}.n3{animation:on3 8.0s steps(1) infinite}@keyframes on3{0%,66.3%{fill:#141414}66.8%,95%{fill:#6b6b6b}100%{fill:#141414}}</style>
<rect width="800" height="170" rx="10" fill="#0a0a0a"/>
<line x1="100" y1="70" x2="700" y2="70" stroke="#1f1f1f" stroke-width="4"/>
<line class="pl" x1="100" y1="70" x2="700" y2="70" stroke="#e5e5e5" stroke-width="4"/>
<circle class="n0" cx="100" cy="70" r="16" stroke="#e5e5e5" stroke-width="2" /><text x="100" y="75" text-anchor="middle" fill="#fff" font-weight="700">1</text><text x="100" y="112" text-anchor="middle" fill="#f5f5f5" font-weight="700">SUPORTE DE TI</text><text x="100" y="135" text-anchor="middle" fill="#e5e5e5" font-family="sans-serif" style="font-size:15px">支援</text><circle class="n1" cx="300" cy="70" r="16" stroke="#e5e5e5" stroke-width="2" /><text x="300" y="75" text-anchor="middle" fill="#fff" font-weight="700">2</text><text x="300" y="112" text-anchor="middle" fill="#f5f5f5" font-weight="700">AUTOMAÇÃO</text><text x="300" y="135" text-anchor="middle" fill="#e5e5e5" font-family="sans-serif" style="font-size:15px">自動化</text><circle class="n2" cx="500" cy="70" r="16" stroke="#e5e5e5" stroke-width="2" /><text x="500" y="75" text-anchor="middle" fill="#fff" font-weight="700">3</text><text x="500" y="112" text-anchor="middle" fill="#f5f5f5" font-weight="700">DADOS</text><text x="500" y="135" text-anchor="middle" fill="#e5e5e5" font-family="sans-serif" style="font-size:15px">データ</text><circle class="n3" cx="700" cy="70" r="16" stroke="#e5e5e5" stroke-width="2" stroke-dasharray="4 3"/><text x="700" y="75" text-anchor="middle" fill="#fff" font-weight="700">4</text><text x="700" y="112" text-anchor="middle" fill="#f5f5f5" font-weight="700">SEGURANÇA</text><text x="700" y="135" text-anchor="middle" fill="#e5e5e5" font-family="sans-serif" style="font-size:15px">防御</text><text x="700" y="155" text-anchor="middle" fill="#737373" style="font-size:11px">[ em andamento ]</text>
</svg>
