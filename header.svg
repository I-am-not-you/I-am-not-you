<svg xmlns="http://www.w3.org/2000/svg" width="800" height="260" viewBox="0 0 800 260">
<style>
.p{animation:fall linear infinite}
@keyframes fall{0%{transform:translate(0,0) rotate(0)}100%{transform:translate(var(--dx),290px) rotate(360deg)}}
.crow{animation:fly linear infinite}
@keyframes fly{0%{transform:translateX(850px)}100%{transform:translateX(-120px)}}
.w{transform-origin:20px 0;animation:flap .5s ease-in-out infinite alternate}
@keyframes flap{to{transform:scaleY(-.6)}}
.glow{animation:pulse 4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.45}}
.g1{animation:gl1 3s steps(1) infinite}.g2{animation:gl2 3s steps(1) infinite}
@keyframes gl1{0%,86%,100%{transform:translate(0,0)}88%{transform:translate(-4px,2px)}91%{transform:translate(3px,-2px)}94%{transform:translate(-2px,0)}}
@keyframes gl2{0%,86%,100%{transform:translate(0,0)}88%{transform:translate(4px,-1px)}91%{transform:translate(-3px,2px)}94%{transform:translate(2px,1px)}}
.scan{animation:scan 5s linear infinite}
@keyframes scan{0%{transform:translateY(-10px)}100%{transform:translateY(270px)}}
.cur{animation:blink 1s steps(1) infinite}@keyframes blink{50%{opacity:0}}
</style>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#050505"/><stop offset="1" stop-color="#2a0000"/></linearGradient>
<radialGradient id="mg"><stop offset=".55" stop-color="#e10600" stop-opacity=".55"/><stop offset="1" stop-color="#e10600" stop-opacity="0"/></radialGradient>
<radialGradient id="moon" cx=".4" cy=".4"><stop offset="0" stop-color="#ff3b30"/><stop offset="1" stop-color="#9d0208"/></radialGradient>
</defs>
<rect width="800" height="260" rx="14" fill="url(#bg)"/>
<circle class="glow" cx="640" cy="105" r="120" fill="url(#mg)"/>
<circle cx="640" cy="105" r="68" fill="url(#moon)"/>
<circle cx="618" cy="88" r="9" fill="#7a0006" opacity=".35"/><circle cx="662" cy="125" r="13" fill="#7a0006" opacity=".3"/>
<path d="M0 230 L60 205 L110 220 L170 190 L230 215 L300 200 L360 222 L430 196 L500 218 L560 205 L640 224 L720 200 L800 215 L800 260 L0 260Z" fill="#000"/>
<g class="crow" style="animation-duration:14s;animation-delay:-0s"><g transform="translate(0 60) scale(1)"><path class="w" d="M0 0 Q10 -10 20 0 Q30 -10 40 0 Q30 -4 20 4 Q10 -4 0 0Z" fill="#050505"/></g></g><g class="crow" style="animation-duration:17s;animation-delay:-5s"><g transform="translate(0 85) scale(0.7)"><path class="w" d="M0 0 Q10 -10 20 0 Q30 -10 40 0 Q30 -4 20 4 Q10 -4 0 0Z" fill="#050505"/></g></g><g class="crow" style="animation-duration:20s;animation-delay:-9s"><g transform="translate(0 45) scale(0.55)"><path class="w" d="M0 0 Q10 -10 20 0 Q30 -10 40 0 Q30 -4 20 4 Q10 -4 0 0Z" fill="#050505"/></g></g>
<g class="p" style="--dx:57px;animation-duration:10.7s;animation-delay:-3.9s"><ellipse cx="351" cy="-10" rx="3.6" ry="2.2" fill="#ff4d6d" opacity=".85"/></g><g class="p" style="--dx:-58px;animation-duration:8.9s;animation-delay:-9.1s"><ellipse cx="394" cy="-10" rx="4.1" ry="2.5" fill="#e10600" opacity=".85"/></g><g class="p" style="--dx:64px;animation-duration:6.3s;animation-delay:-0.9s"><ellipse cx="448" cy="-10" rx="4.8" ry="2.9" fill="#ff4d6d" opacity=".85"/></g><g class="p" style="--dx:69px;animation-duration:9.2s;animation-delay:-5.8s"><ellipse cx="248" cy="-10" rx="3.7" ry="2.2" fill="#e10600" opacity=".85"/></g><g class="p" style="--dx:-6px;animation-duration:10.9s;animation-delay:-0.5s"><ellipse cx="70" cy="-10" rx="6.1" ry="3.6" fill="#e10600" opacity=".85"/></g><g class="p" style="--dx:-34px;animation-duration:8.7s;animation-delay:-5.7s"><ellipse cx="167" cy="-10" rx="5.2" ry="3.1" fill="#ff4d6d" opacity=".85"/></g><g class="p" style="--dx:-64px;animation-duration:8.9s;animation-delay:-1.9s"><ellipse cx="615" cy="-10" rx="3.8" ry="2.3" fill="#ff8fa3" opacity=".85"/></g><g class="p" style="--dx:0px;animation-duration:9.1s;animation-delay:-5.0s"><ellipse cx="81" cy="-10" rx="5.1" ry="3.1" fill="#e10600" opacity=".85"/></g><g class="p" style="--dx:-34px;animation-duration:10.6s;animation-delay:-3.6s"><ellipse cx="619" cy="-10" rx="4.2" ry="2.5" fill="#ff8fa3" opacity=".85"/></g><g class="p" style="--dx:7px;animation-duration:6.4s;animation-delay:-3.0s"><ellipse cx="269" cy="-10" rx="5.0" ry="3.0" fill="#ff8fa3" opacity=".85"/></g><g class="p" style="--dx:27px;animation-duration:7.4s;animation-delay:-9.8s"><ellipse cx="479" cy="-10" rx="3.9" ry="2.3" fill="#ff4d6d" opacity=".85"/></g><g class="p" style="--dx:-61px;animation-duration:6.8s;animation-delay:-4.9s"><ellipse cx="370" cy="-10" rx="3.6" ry="2.2" fill="#ff8fa3" opacity=".85"/></g><g class="p" style="--dx:9px;animation-duration:9.9s;animation-delay:-8.2s"><ellipse cx="606" cy="-10" rx="4.5" ry="2.7" fill="#ff8fa3" opacity=".85"/></g><g class="p" style="--dx:-11px;animation-duration:8.9s;animation-delay:-4.6s"><ellipse cx="528" cy="-10" rx="6.0" ry="3.6" fill="#e10600" opacity=".85"/></g><g class="p" style="--dx:67px;animation-duration:9.3s;animation-delay:-0.6s"><ellipse cx="733" cy="-10" rx="5.6" ry="3.4" fill="#ff8fa3" opacity=".85"/></g><g class="p" style="--dx:-75px;animation-duration:7.4s;animation-delay:-3.9s"><ellipse cx="476" cy="-10" rx="5.5" ry="3.3" fill="#e10600" opacity=".85"/></g>
<g font-family="Courier New,monospace" font-weight="700" font-size="62">
<text class="g1" x="60" y="118" fill="#e10600" opacity=".8">Am I you?</text>
<text class="g2" x="60" y="118" fill="#00e5ff" opacity=".35">Am I you?</text>
<text x="60" y="118" fill="#ffffff">Am I you?</text>
</g>
<text x="62" y="158" font-family="sans-serif" font-size="22" fill="#d4d4d4" letter-spacing="4">私はあなたではない</text>
<text x="62" y="190" font-family="Courier New,monospace" font-size="16" fill="#e10600">&gt; I-am-not-you<tspan class="cur">_</tspan></text>
<rect class="scan" x="0" y="0" width="800" height="3" fill="#e10600" opacity=".18"/>
</svg>
